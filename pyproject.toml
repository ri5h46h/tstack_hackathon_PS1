[project]
name = "tstack-hackathon-ps1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishabh Narayan", email = "nrishabh138@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "gtfs-realtime-bindings>=3.0.0",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
tstack-hackathon-ps1 = "tstack_hackathon_ps1:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
